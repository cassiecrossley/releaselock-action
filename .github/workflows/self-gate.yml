# Scan this repo with ReleaseLock.
# actions/checkout is Unlocked in the public directory, so fail-on unlocked
# would fail this workflow even with a commit pin. This job enforces SHA
# pins (fail-on: none) and then proves the unlocked bar still fails a
# mutable tag in test/fixtures.
name: releaselock-self-gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests
        run: node --test

      - name: ReleaseLock gate
        id: gate
        uses: ./
        with:
          fail-on: none
          require-sha-pinning: true

      - name: Confirm this repo passes SHA pinning
        if: steps.gate.outputs.policy-failed != 'false'
        run: |
          echo "Self scan should pass: checkout is pinned and fail-on is none."
          exit 1

      - name: Scan an unpinned Unlocked action
        id: fixture
        continue-on-error: true
        uses: ./
        with:
          fail-on: unlocked
          require-sha-pinning: true
          workflow-glob: test/fixtures/unlocked-tag/ci.yml

      - name: Confirm the unlocked tag fails policy
        if: steps.fixture.outputs.policy-failed != 'true'
        run: |
          echo "Expected policy-failed=true for actions/checkout@v4."
          exit 1
